<a [href]="url" target="_blank" rel="noopener noreferrer" [title]="url"
  class="group inline-flex items-center gap-2 px-3 py-2 rounded-lg border border-primary-200 dark:border-primary-700 bg-primary-50 dark:bg-primary-900 hover:bg-primary-100 dark:hover:bg-primary-800 hover:border-primary-300 dark:hover:border-primary-600 transition-colors min-w-0">
  <span
    class="flex items-center justify-center w-6 h-6 rounded-md bg-primary-100 dark:bg-primary-800 text-primary-500 dark:text-primary-300 shrink-0">
    <i class="pi pi-globe text-xs!"></i>
  </span>
  <span class="flex flex-col min-w-0 leading-tight">
    @if (display.segment) {
    <span class="text-[11px] font-medium text-primary-500 dark:text-primary-400 truncate max-w-[180px]">{{
      display.domain }}</span>
    <span class="text-xs font-semibold text-primary-800 dark:text-primary-100 truncate max-w-[180px]">{{
      display.segment }}</span>
    } @else {
    <span class="text-xs font-semibold text-primary-700 dark:text-primary-200 truncate max-w-[180px]">{{
      display.domain }}</span>
    }
  </span>
  <i
    class="pi pi-external-link text-[10px]! text-primary-400 dark:text-primary-500 shrink-0 ml-0.5 opacity-70 group-hover:opacity-100 transition-opacity"></i>
</a>
