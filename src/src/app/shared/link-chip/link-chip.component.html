<ng-container *transloco="let t">
  <div class="flex flex-col gap-2 min-w-0">
    @for (group of groups; track group.domain) {
    <div class="min-w-0">
      <div class="flex items-center gap-2 mb-1">
        <span class="w-1.5 h-1.5 rounded-full bg-primary-400 dark:bg-primary-500 shrink-0"></span>
        <span class="text-xs font-semibold text-primary-800 dark:text-primary-100 truncate">{{ group.domain }}</span>
        @if (group.links.length > 1) {
        <span
          class="text-[10px] font-bold text-primary-500 dark:text-primary-400 bg-primary-100 dark:bg-primary-800 rounded-full px-1.5 leading-4">{{
          group.links.length }}</span>
        }
      </div>
      <div class="flex flex-col gap-0.5 ml-[3px] pl-3 border-l-2 border-primary-200 dark:border-primary-700">
        @for (link of group.links; track link.index) {
        <div
          class="group/row flex items-center gap-0.5 rounded-md hover:bg-primary-50 dark:hover:bg-primary-900 min-w-0">
          <a [href]="link.url" target="_blank" rel="noopener noreferrer" [title]="link.url"
            class="flex items-center gap-2 px-2 py-1 flex-1 min-w-0">
            <span class="text-xs text-primary-700 dark:text-primary-200 truncate flex-1 min-w-0">{{
              link.display.segment || link.display.domain }}</span>
            <i
              class="pi pi-external-link text-[10px]! text-primary-400 dark:text-primary-500 shrink-0 opacity-0 group-hover/row:opacity-100"></i>
          </a>
          @if (editable) {
          <p-button (click)="editLink(link.index)" icon="pi pi-pencil" text size="small"
            [pTooltip]="t('common.actions.edit')" styleClass="opacity-0 group-hover/row:opacity-100 shrink-0 mr-1" />
          }
        </div>
        }
      </div>
    </div>
    }
  </div>
</ng-container>
